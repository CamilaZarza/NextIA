services:
  n8n:
    # Versión fija para que todo el grupo y la defensa usen exactamente el mismo n8n
    image: docker.n8n.io/n8nio/n8n:2.46.6
    container_name: nextia-n8n
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=America/Argentina/Buenos_Aires
      - TZ=America/Argentina/Buenos_Aires
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data: